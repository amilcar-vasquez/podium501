name: Trigger auto deployment for podium501

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          [[ -n "${{ secrets.PODIUM501_AZURE_CLIENT_ID }}" ]] || { echo "Missing PODIUM501_AZURE_CLIENT_ID"; exit 1; }
          [[ -n "${{ secrets.PODIUM501_AZURE_TENANT_ID }}" ]] || { echo "Missing PODIUM501_AZURE_TENANT_ID"; exit 1; }
          [[ -n "${{ secrets.PODIUM501_AZURE_SUBSCRIPTION_ID }}" ]] || { echo "Missing PODIUM501_AZURE_SUBSCRIPTION_ID"; exit 1; }
          [[ -n "${{ secrets.PODIUM501_REGISTRY_USERNAME }}" ]] || { echo "Missing PODIUM501_REGISTRY_USERNAME"; exit 1; }
          [[ -n "${{ secrets.PODIUM501_REGISTRY_PASSWORD }}" ]] || { echo "Missing PODIUM501_REGISTRY_PASSWORD"; exit 1; }

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PODIUM501_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PODIUM501_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PODIUM501_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: ./Dockerfile
          registryUrl: stuapps.azurecr.io
          registryUsername: ${{ secrets.PODIUM501_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PODIUM501_REGISTRY_PASSWORD }}
          containerAppName: podium501
          resourceGroup: STUApps
          imageToBuild: stuapps.azurecr.io/podium501:${{ github.sha }}

      - name: Patch Container App storage mount
        shell: bash
        run: |
          cat >/tmp/podium501-containerapp-patch.json <<'JSON'
          {
            "properties": {
              "template": {
                "containers": [
                  {
                    "name": "bootstrap-container-pre-deployment",
                    "image": "stuapps.azurecr.io/podium501:${{ github.sha }}",
                    "probes": [],
                    "resources": {
                      "cpu": 0.5,
                      "ephemeralStorage": "2Gi",
                      "memory": "1Gi"
                    },
                    "env": [
                      {
                        "name": "DATABASE_URL",
                        "value": "/data/sqlite.db"
                      }
                    ],
                    "volumeMounts": [
                      {
                        "volumeName": "dbmount",
                        "mountPath": "/data"
                      }
                    ]
                  }
                ],
                "initContainers": null,
                "revisionSuffix": "",
                "scale": {
                  "cooldownPeriod": 300,
                  "maxReplicas": 1,
                  "minReplicas": 1,
                  "pollingInterval": 30,
                  "rules": null
                },
                "serviceBinds": null,
                "terminationGracePeriodSeconds": null,
                "volumes": [
                  {
                    "name": "dbmount",
                    "storageName": "dbshare",
                    "storageType": "AzureFile"
                  }
                ]
              }
            }
          }
          JSON

          app_id=$(az containerapp show -n podium501 -g STUApps --query id -o tsv)
          az rest --method patch --uri "${app_id}?api-version=2024-03-01" --body @/tmp/podium501-containerapp-patch.json
